defaults:
  region:
    name: FVG
    radius: 10
  dates:
    - start: 2023-01-01
      end: 2026-06-30
  save_images: false
  workers: 22
  output_path: /home/esanti/FORECAST/runs/learning_test


best_multiclass_no_IG:
  force: learning
  fold_rm:
    strategy: multiclass_no_ig
    ratio: 4.0
    split: date
    test_ratio: 0.3
    seed: 52
    cleaning:
      min_support: 30
      min_exception_support: 50
    exclude_features:
      prev_cloud: [coverage_clouds, cloud_total_day, cloud_, region_cloud]
    output: ../best/multiclass_no_ig
    gpu: false

best_ordinal_count:
  force: learning
  fold_rm:
    strategy: ordinal_count
    ratio: 1.0
    split: date
    test_ratio: 0.3
    seed: 52
    cleaning:
      min_support: 10
      min_exception_support: 40
      mdl_lambda: 5
      snap: true
    exclude_features:
      prev_cloud: [coverage_clouds, cloud_total_day, cloud_, region_cloud]
    gpu: false
    output: ../best/ordinal_count
    

best_ordinal:
  force: learning
