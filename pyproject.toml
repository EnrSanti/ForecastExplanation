[project]
name = "forecastexplanation"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cartopy==0.26.0",
    "cfgrib>=0.9.15.1",
    "eccodes==2.50.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "matplotlib==3.11.2",
    "numba==0.68.0",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pandas-stubs==3.0.5.260914",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "tobac>=1.6.4",
    "tqdm>=4.70.1",
    "xarray>=2026.9.0",
    "ecmwf-datastores-client>=0.5.3",
    "scikit-learn>=1.9.1",
    "opencv-python-headless>=5.0.0.93",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
extend-exclude = ["src/learning/CUDatILP"]

[tool.black]
extend-exclude = "src/learning/CUDatILP"
